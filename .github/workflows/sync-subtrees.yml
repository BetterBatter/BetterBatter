name: Sync subtrees

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-subtrees
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}

    steps:
      - name: Check out root repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pull latest UI subtree
        id: sync
        shell: bash
        env:
          UI_READ_TOKEN: ${{ secrets.UI_READ_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before="$(git rev-parse HEAD)"
          basic_auth="$(printf 'x-access-token:%s' "$UI_READ_TOKEN" | base64 -w 0)"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic_auth}" \
            subtree pull \
            --prefix=ui \
            https://github.com/BetterBatter/ui.git \
            main \
            -m "chore(ui): sync subtree"

          after="$(git rev-parse HEAD)"

          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push updated root
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic_auth}" \
            push origin HEAD:main

  mirror:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/mirror-gitlab.yml
    secrets: inherit
