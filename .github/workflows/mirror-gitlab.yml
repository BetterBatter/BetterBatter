name: Mirror to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:
  workflow_call:
    secrets:
      GITLAB_TOKEN:
        required: true
      GITLAB_AUTHOR_EMAIL_MAP:
        required: true

permissions:
  contents: read

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror branches and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_AUTHOR_EMAIL_MAP: ${{ secrets.GITLAB_AUTHOR_EMAIL_MAP }}
          GITLAB_REPOSITORY: https://lab.ssafy.com/s15-bigdata-recom-sub1/S15P21B203.git
        run: |
          set -euo pipefail

          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repository.git

          cd repository.git

          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch --force --env-filter '
            canonical_name() {
              case "$1" in
                "Junyou Park") printf "%s" "박준유" ;;
                "Ryan Min"|"RyanMin") printf "%s" "민경철" ;;
                "HJ") printf "%s" "손현준" ;;
                "DESKTOP-UB20P0O\SSAFY") printf "%s" "기하영" ;;
                "Juwon") printf "%s" "나주원" ;;
                "윤선민") printf "%s" "윤선민" ;;
                *) printf "%s" "$1" ;;
              esac
            }

            canonical_email() {
              target_name="$1"
              current_email="$2"
              tab="$(printf "\t")"
              mapped_line="$(
                printf "%s\n" "$GITLAB_AUTHOR_EMAIL_MAP" |
                  grep -F -m1 "${target_name}${tab}" || true
              )"

              if [ -n "$mapped_line" ]; then
                printf "%s\n" "$mapped_line" | cut -f2-
              else
                printf "%s" "$current_email"
              fi
            }

            GIT_AUTHOR_NAME="$(canonical_name "$GIT_AUTHOR_NAME")"
            GIT_COMMITTER_NAME="$(canonical_name "$GIT_COMMITTER_NAME")"
            GIT_AUTHOR_EMAIL="$(canonical_email "$GIT_AUTHOR_NAME" "$GIT_AUTHOR_EMAIL")"
            GIT_COMMITTER_EMAIL="$(canonical_email "$GIT_COMMITTER_NAME" "$GIT_COMMITTER_EMAIL")"
            export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL
            export GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL
          ' --tag-name-filter cat -- --all

          git for-each-ref --format="delete %(refname)" refs/original/ |
            git update-ref --stdin

          rewritten_names="$(git log --all --format="%an%n%cn" | sort -u)"

          for old_name in \
            "Junyou Park" \
            "Ryan Min" \
            "RyanMin" \
            "HJ" \
            "DESKTOP-UB20P0O\SSAFY" \
            "Juwon"; do
            if grep -Fqx "$old_name" <<< "$rewritten_names"; then
              echo "Author rewrite failed for: $old_name" >&2
              exit 1
            fi
          done

          for expected_name in \
            "박준유" \
            "민경철" \
            "손현준" \
            "기하영" \
            "나주원" \
            "윤선민"; do
            if ! grep -Fqx "$expected_name" <<< "$rewritten_names"; then
              echo "Expected author is missing after rewrite: $expected_name" >&2
              exit 1
            fi
          done

          rewritten_identities="$(
            git log --all --format="%an%x09%ae%n%cn%x09%ce" | sort -u
          )"
          tab="$(printf "\t")"

          while IFS="$tab" read -r expected_name expected_email; do
            if [ -z "$expected_name" ] || [ -z "$expected_email" ]; then
              echo "Invalid author email mapping" >&2
              exit 1
            fi

            expected_identity="${expected_name}${tab}${expected_email}"
            if ! grep -Fqx "$expected_identity" <<< "$rewritten_identities"; then
              echo "Expected author email is missing for: $expected_name" >&2
              exit 1
            fi

            unexpected_identities="$(
              grep -F "${expected_name}${tab}" <<< "$rewritten_identities" |
                grep -Fvx "$expected_identity" || true
            )"
            if [ -n "$unexpected_identities" ]; then
              echo "Unexpected author email remains for: $expected_name" >&2
              exit 1
            fi
          done <<< "$GITLAB_AUTHOR_EMAIL_MAP"

          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPOSITORY#https://}"

          git push --prune gitlab "+refs/heads/*:refs/heads/*"
          git push --prune gitlab "+refs/tags/*:refs/tags/*"
