name: Mirror to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:
  workflow_call:
    secrets:
      GITLAB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror branches and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY: https://lab.ssafy.com/s15-bigdata-recom-sub1/S15P21B203.git
        run: |
          set -euo pipefail

          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repository.git

          cd repository.git
          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPOSITORY#https://}"

          git push --prune gitlab "refs/heads/*:refs/heads/*"
          git push --prune gitlab "refs/tags/*:refs/tags/*"

