name: Sync UI to root repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-ui-to-root
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out root repository
        uses: actions/checkout@v6
        with:
          repository: BetterBatter/BetterBatter
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ROOT_SYNC_TOKEN }}
          persist-credentials: false

      - name: Pull latest UI subtree
        id: sync
        shell: bash
        env:
          UI_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before="$(git rev-parse HEAD)"
          basic_auth="$(printf 'x-access-token:%s' "$UI_READ_TOKEN" | base64 -w 0)"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic_auth}" \
            subtree pull \
            --prefix=ui \
            https://github.com/BetterBatter/ui.git \
            main \
            -m "chore(ui): sync subtree"

          after="$(git rev-parse HEAD)"

          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push updated root
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          ROOT_SYNC_TOKEN: ${{ secrets.ROOT_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          basic_auth="$(printf 'x-access-token:%s' "$ROOT_SYNC_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic_auth}" \
            push origin HEAD:main
